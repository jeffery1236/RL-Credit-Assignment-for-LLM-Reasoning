[project]
name = "causal-credit-rl"
version = "0.1.0"
description = "Causal credit assignment in LLM RL — Countdown environment and exact credit oracle"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
