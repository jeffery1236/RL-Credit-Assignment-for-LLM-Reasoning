[project]
name = "causal-credit-rl"
version = "0.1.0"
description = "Causal credit assignment in LLM RL — Countdown environment and exact credit oracle"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (run explicitly with '-m slow', e.g. the MC-vs-exact rollout check)",
]
